name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets are needed: extraction and the ERP are not exercised in CI.
  # An empty key is a valid configuration - the suite must run offline.
  ANTHROPIC_API_KEY: ""

permissions:
  contents: read

jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv stopped publishing floating major tags after v7,
      # so `@v10` does not resolve. Pin the exact release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyright
        run: uv run pyright

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the version pinned in
        # .python-version. Both are tested so the floor stays real.
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ap_agent
          POSTGRES_PASSWORD: ap_agent
          POSTGRES_DB: ap_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ap_agent -d ap_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ap_agent:ap_agent@localhost:5432/ap_agent

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      # Pinned to the same version .pre-commit-config.yaml uses, so a commit that
      # passes the local hook cannot fail here for a different reason.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      # The official gitleaks-action wraps this binary in a licence check that
      # exits 1 on a repository with no findings. Running the binary directly is
      # the same scan without the dependency, and it is exactly what the
      # pre-commit hook runs locally.
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git . --redact --verbose --exit-code 1
