# ap-agent guardrails, version 1.
#
# Every tolerance and every approval threshold lives here rather than in code.
# The audit question this exists to answer is "why was this auto-approved", and
# the answer has to be "rule set guardrails_v1, as it read on that date" - so
# this file is never edited in place. A change means a new file
# (guardrails.v2.yaml), a new `config_version`, and both remaining resolvable,
# because a decision made last quarter must stay re-explainable under last
# quarter's rules.
#
# `compute_match` takes this as an argument and stamps `config_version` on every
# `MatchResult`. Nothing here is a default: the loader has no fallbacks, so a
# value missing from this file is a startup error rather than a silently
# different answer.
#
# Values come from the guardrail section of the architecture report unless noted.
# Four deliberately diverge, each with a recorded decision in DECISIONS.md:
# auto_approve_max_amount, invoice_max_age_days, rounding_tolerance_abs, and the
# unmatched-charge rule, which is an AND here where the report writes an OR.

config_version: "guardrails_v1"
base_currency: "USD"

# --- Match tolerances ------------------------------------------------------
# Percentages are percent, not fractions: 2.0 means 2%.

tolerances:
  # Unit price: within ±2% AND within $50 on the line. Both must hold, so the
  # tighter one binds - 2% of a $12 line is noise, and $50 on a $200,000 line is
  # a rounding error. Either alone lets one of those through.
  price_variance_pct: "2.0"
  price_variance_abs: "50.00"

  # Never pay for more than arrived. Zero, and not a band: over-billing is not a
  # measurement error, it is a claim about goods that do not exist.
  qty_over_billing_pct: "0"

  # Billing for less than arrived is the vendor's loss and nobody's exception.
  # 100 means any shortfall passes; a partial invoice against a partial delivery
  # is the ordinary case, not a defect.
  qty_under_billing_pct: "100"

  # Freight, handling and anything else no purchase-order line covers. Both
  # halves must hold, exactly like the price band: a charge rides along only if
  # it is within $50 AND within 2% of the order's value, so the tighter one
  # binds.
  #
  # DIVERGES from the report, which writes this as "≤ $50 *or* ≤ 2% of PO
  # value". An OR is the looser reading and it is the wrong way round here: on a
  # $650,000 order the 2% arm alone would wave through $13,000 of unexplained
  # freight, which is precisely the charge a person should see. AND means the
  # percentage only ever tightens the rule on small orders.
  #
  # The generated fixture asserts both sides: a $25 freight line passes, and a
  # $120 one does not. Worth knowing that $120 fails on the *absolute* half on
  # every seeded order - the percentage arm alone would pass it everywhere,
  # which is the AND earning its place.
  unmatched_charge_abs: "50.00"
  unmatched_charge_pct: "2.0"

  # A year. DIVERGES from the report's 180 days, deliberately - see DECISIONS.md
  # 2026-09-10. The two failure modes are not symmetric: too wide and the date
  # rule declines to choose and something later settles it, too narrow and it
  # *silently eliminates a candidate that was correct*. Six months was the first
  # value and it resolved a real 09/03/2024 to the wrong month.
  invoice_max_age_days: 365

  # Tax computed against the line rates, absolute only: a percentage band on tax
  # is a percentage of a percentage and stops meaning anything.
  tax_variance_abs: "1.00"

  # What is left after every line-level check has passed - rounding, and nothing
  # else. DIVERGES from the report's $10 total-variance figure, which was doing
  # a different job: this one is deliberately tight because anything larger than
  # rounding should already have been caught on a line.
  rounding_tolerance_abs: "1.00"

# --- Approval matrix -------------------------------------------------------

approval_matrix:
  # Straight-through processing is OFF. The report suggests $1,000 as an
  # auto-approve floor; this is 0 until the golden set says what the exception
  # rate actually is. Turning it on is a reviewed change with a number attached,
  # not a default somebody inherited. See DECISIONS.md 2026-09-09.
  auto_approve_max_amount: "0.00"

  # Bands by invoice total, smallest first. `max_amount: null` is the unbounded
  # top band. These apply when nothing in `rules` below overrides them.
  tiers:
    - max_amount: "1000.00"
      approver_role: "ap_clerk"
      approvers_required: 1
    - max_amount: "10000.00"
      approver_role: "controller"
      approvers_required: 1
    - max_amount: null
      approver_role: "owner"
      approvers_required: 2

  # Conditions that decide approval regardless of amount. `overrides_tiers: true`
  # means the amount band does not get to lower the requirement - a $40 invoice
  # from a vendor nobody has onboarded still needs two people.
  rules:
    - name: "new_vendor"
      when: "the vendor did not resolve against the vendor master"
      approvers_required: 2
      overrides_tiers: true
      hold_for_callback: false

    - name: "first_invoice_from_vendor"
      when: "the vendor resolved, but this is the first invoice ever seen from it"
      approvers_required: 2
      overrides_tiers: true
      hold_for_callback: false

    - name: "remit_to_mismatch"
      when: "the remit-to block on the document disagrees with the vendor master"
      approvers_required: 2
      overrides_tiers: true
      # The number-one AP fraud vector is a "vendor" asking to change bank
      # details. Verification is a phone call to a number already on file,
      # never one printed on the document.
      hold_for_callback: true

    - name: "match_exception"
      when: "the three-way match produced any reason code"
      approvers_required: 1
      overrides_tiers: false
      hold_for_callback: false

# --- Input validation ------------------------------------------------------
# Applied before any model call, so a hostile file is rejected without ever
# being read by anything that could act on it.

input_validation:
  # A 20-page "invoice" is a statement, a contract, or an attack.
  max_pages: 20
  max_file_bytes: 26214400 # 25 MiB
  allowed_mime_types:
    - "application/pdf"
    - "image/png"
    - "image/jpeg"
    - "image/tiff"
  # Matches the contracts' own caps, so a document cannot inflate a payload
  # past what InvoiceExtraction will hold anyway.
  max_line_items: 500
  max_field_length: 500

  # Added 2026-10-05, in place rather than as v2: v1 had governed no payment,
  # and the only trails stamped guardrails_v1 used the tolerances, which are
  # unchanged. See DECISIONS.md 2026-10-05.
  #
  # A PDF that needs a password cannot be checked for anything below, so it is
  # never read. Owner-password-only PDFs (print/edit restrictions) open freely
  # and are not affected.
  allow_password_protected: false

  # Text a person cannot see is text written for a machine. Both numbers were
  # measured against the local corpus (160 PDFs): the only near-white spans are
  # the planted hidden_text variant, and the faintest real page renders 1.9% ink.
  hidden_text:
    near_white_min: 240 # every RGB channel at or above this is near-white
    min_ink_fraction: 0.002 # a text layer rendering less ink than this is invisible

# --- Output filter ---------------------------------------------------------
# Checked on model output *before* anything downstream reads it. These are not
# corrections: a match sends the run to a person, and nothing is rewritten.
# Silently stripping an IBAN out of a field would destroy the evidence that
# somebody tried.

output_filter:
  action: "route_to_human"
  never_auto_fix: true

  # Every string field of every reading is screened, except these. The remit-to
  # block is *expected* to print payment details, so a pattern match there says
  # nothing; it is compared server-side to the vendor master by lookup_vendor
  # instead, and only the boolean comes back. Added 2026-10-05, in place - see
  # the note under input_validation.
  unscreened_fields:
    - "remit_to_display"

  # `skip_fields` names fields where a pattern is expected to match on honest
  # documents. Only account_number_like has any: an 8-digit invoice number is
  # the Kaggle corpus's ordinary format, and flagging every one would send the
  # whole golden set to a person and teach reviewers to approve without reading.
  patterns:
    - name: "iban"
      pattern: "\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}\\b"
      why: "A payment destination has one source, the vendor master, and it is not the document."
      skip_fields: []

    - name: "account_number_like"
      pattern: "\\b[0-9]{8,17}\\b"
      why: "Bare digit runs of account length. Noisy on purpose - a false positive costs a review."
      skip_fields:
        - "invoice_number"
        - "po_references"
        - "line_items.po_line_ref"
        - "vendor_tax_id"
        - "bill_to_tax_id"

    - name: "update_bank"
      pattern: "(?i)\\b(updat|chang|amend|new)\\w*\\b[^.]{0,30}\\bbank\\b"
      why: "The single most common AP fraud is a request to change where money goes."
      skip_fields: []

    - name: "change_remittance"
      pattern: "(?i)\\b(updat|chang|amend|new)\\w*\\b[^.]{0,30}\\bremit"
      why: "The same request in the vocabulary an invoice template would use."
      skip_fields: []

    # The five below were added 2026-10-05.
    - name: "url"
      pattern: "(?i)\\b(?:https?://|www\\.)\\S+"
      why: "A link in a transcribed field is somewhere a reader is being sent. No field here needs one."
      skip_fields: []

    - name: "ignore_instructions"
      pattern: "(?i)\\b(?:ignore|disregard|forget)\\b[^.]{0,40}\\b(?:instruction|prompt|previous|prior|above|rule)"
      why: "Text addressed to a model rather than to a person. On an invoice it has no honest reading."
      skip_fields: []

    - name: "transfer_funds"
      pattern: "(?i)\\b(?:transfer|wire)\\b[^.]{0,30}\\b(?:funds|payment|money|amount)\\b"
      why: "A movement of money requested in prose rather than in a line item."
      skip_fields: []

    - name: "update_account"
      pattern: "(?i)\\b(?:updat|chang|amend)\\w*\\b[^.]{0,30}\\baccount\\b"
      why: "update_bank without the word bank: 'update the account on file'."
      skip_fields: []

    - name: "pay_to"
      pattern: "(?i)\\bpay\\s+(?:to|into)\\b"
      why: "A payment destination stated outside the remit-to block, where nothing compares it to the master."
      skip_fields: []

# --- Hard prohibitions -----------------------------------------------------
# Not thresholds. These tools do not exist, and this section is the written
# statement of that - `tests/tools/test_tool_contracts.py` walks the package and
# fails if one appears.
#
# The authority stays `FORBIDDEN_TOOL_NAMES` in code, and this file is asserted
# to agree with it. That direction is deliberate: a prohibition that could be
# lifted by editing a YAML file is not a prohibition.

hard_prohibitions:
  forbidden_tool_names:
    - "pay_bill"
    - "update_vendor"
    - "update_bank_details"
    - "delete_invoice"
    - "delete_vendor"
  forbidden_tool_prefixes:
    - "delete_"
    - "pay_"
    - "update_vendor"
    - "update_bank"
    - "transfer_"
    - "wire_"
