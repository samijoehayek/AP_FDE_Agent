# The sandbox vendor master, version 1.
#
# This file defines the vendors. `scripts/seed_sandbox.py` builds VENDORS from
# it, and `scripts/generate_invoices.py` reads the country and postal address
# from it when rendering an invoice. There is one definition of a vendor and
# both scripts read it, so a vendor cannot exist in QuickBooks under terms this
# repository disagrees with.
#
# Why a file rather than the manifest: `data/generated/seed_manifest.json` is a
# record of what was created *in QuickBooks*, and QuickBooks was never told
# either of these facts - the vendor create sends DisplayName, CompanyName and
# TaxIdentifier and nothing else. The country and the postal address are things
# the vendor master knows and the ERP does not, which is exactly what
# ARCHITECTURE.md means when it says the vendor master is the authority. The
# manifest is joined to this file on `display_name`.
#
# `country` is load-bearing, not decoration. It is the input to the ambiguous-
# date rule (`country_reads_day_first` in
# `src/ap_agent/tools/compute_extraction_confidence.py`): 09/03/2024 on an
# Indian invoice is 9 March and on a US invoice is 3 September, and nothing in
# the document settles it. Every value here is derived from the tax identifier
# that was already in the fixture - a 15-character GSTIN is Indian and its first
# two digits are the state code; an NN-NNNNNNN EIN is US - so the countries are
# read off the data rather than chosen. The Indian addresses sit in the state
# their GSTIN prefix names.
#
# Addresses are synthetic, for fictional companies. No bank details appear here
# or anywhere else in this repository: the remittance block on a generated
# invoice carries a postal address and nothing more, and rule 2 of CLAUDE.md
# means the only authority for remittance is this vendor master, compared
# server-side. Adding an account number to this file would defeat that.

version: "v1"

